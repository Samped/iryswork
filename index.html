<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Irys Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #f8fafc;
            --bg-card: #ffffff;
            --accent-primary: #2563eb;
            --accent-secondary: #3b82f6;
            --accent-tertiary: #60a5fa;
            --accent-dark: #1e40af;
            --accent-light: #93c5fd;
            --text-primary: #1e293b;
            --text-secondary: #475569;
            --text-muted: #64748b;
            --border: rgba(37, 99, 235, 0.15);
            --shadow-sm: 0 1px 3px rgba(37, 99, 235, 0.1);
            --shadow-md: 0 4px 12px rgba(37, 99, 235, 0.15);
            --shadow-lg: 0 10px 30px rgba(37, 99, 235, 0.2);
            --glow-primary: rgba(37, 99, 235, 0.2);
            --glow-secondary: rgba(59, 130, 246, 0.25);
            --glow-tertiary: rgba(96, 165, 250, 0.15);
        }

        body {
            font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #ffffff 0%, #f8fafc 50%, #ffffff 100%);
            background-attachment: fixed;
            color: var(--text-primary);
            line-height: 1.6;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 20% 30%, rgba(37, 99, 235, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(59, 130, 246, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(96, 165, 250, 0.03) 0%, transparent 60%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 32px;
            position: relative;
            z-index: 1;
        }

        .profile-header {
            display: flex;
            align-items: center;
            gap: 40px;
            margin: 60px 0 80px;
            padding: 56px;
            background: linear-gradient(135deg, #ffffff 0%, #f8fafc 100%);
            border-radius: 28px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-md), 0 0 40px var(--glow-primary);
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(30px);
            position: relative;
            overflow: hidden;
        }


        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        .profile-header::after {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 0%, rgba(37, 99, 235, 0.03), transparent 70%);
            pointer-events: none;
        }

        .profile-header:hover {
            box-shadow: var(--shadow-lg), 0 0 60px var(--glow-secondary);
            transform: translateY(-6px);
            border-color: rgba(37, 99, 235, 0.3);
        }

        .profile-image-container {
            position: relative;
            width: 160px;
            height: 160px;
            flex-shrink: 0;
        }

        .profile-image-container::before {
            content: '';
            position: absolute;
            inset: -4px;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary), var(--accent-tertiary));
            border-radius: 50%;
            animation: rotate 8s linear infinite;
            z-index: -1;
            opacity: 0.3;
            filter: blur(12px);
        }

        @keyframes rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .profile-image {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid var(--bg-card);
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            box-shadow: var(--shadow-md), 0 0 30px var(--glow-primary);
        }

        .profile-info {
            flex: 1;
            text-align: left;
            padding: 0;
        }

        .profile-info h2 {
            margin: 0;
            padding: 0 0 4px 0;
        }

        .profile-name {
            font-size: 2.5rem;
            font-weight: 900;
            margin-bottom: 12px;
            background: linear-gradient(135deg, var(--accent-primary) 0%, var(--accent-secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.02em;
            text-align: left;
        }

        .profile-bio {
            color: var(--text-secondary);
            font-size: 1.125rem;
            line-height: 1.8;
            margin-bottom: 24px;
        }

        .social-links {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .social-link {
            display: none;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            background: rgba(37, 99, 235, 0.08);
            border: 1px solid rgba(37, 99, 235, 0.2);
            border-radius: 14px;
            color: var(--accent-primary);
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 600;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(15px);
            position: relative;
            overflow: hidden;
        }

        .social-link::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            opacity: 0;
            transition: opacity 0.4s;
        }

        .social-link span {
            position: relative;
            z-index: 1;
        }

        .social-link svg {
            width: 20px;
            height: 20px;
            flex-shrink: 0;
            position: relative;
            z-index: 1;
            transition: transform 0.3s ease;
        }

        .social-link:hover svg {
            transform: scale(1.1);
        }

        .social-link:hover {
            border-color: rgba(37, 99, 235, 0.4);
            transform: translateY(-3px);
            box-shadow: 0 6px 20px var(--glow-primary);
            color: #ffffff;
        }

        .social-link:hover::before {
            opacity: 1;
        }

        section {
            padding: 80px 0;
            position: relative;
        }

        h2 {
            font-size: clamp(2rem, 4vw, 3rem);
            font-weight: 700;
            margin-bottom: 48px;
            text-align: center;
            background: linear-gradient(135deg, var(--accent-primary) 0%, var(--accent-secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.02em;
            position: relative;
        }

        h2:not(.profile-name)::after {
            content: '';
            position: absolute;
            bottom: -16px;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 4px;
            background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary), var(--accent-tertiary));
            border-radius: 2px;
            box-shadow: 0 0 15px var(--glow-primary);
        }

        .app-card {
            background: linear-gradient(135deg, #ffffff 0%, #f8fafc 100%);
            border-radius: 28px;
            overflow: hidden;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-md), 0 0 30px var(--glow-primary);
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(30px);
            position: relative;
        }

        .app-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, transparent, var(--accent-primary), var(--accent-secondary), var(--accent-tertiary), transparent);
            background-size: 200% 100%;
            opacity: 0;
            transition: opacity 0.5s;
        }

        .app-card:hover {
            transform: translateY(-10px);
            box-shadow: var(--shadow-lg), 0 0 50px var(--glow-secondary);
            border-color: rgba(37, 99, 235, 0.3);
        }

        .app-card:hover::before {
            opacity: 1;
            animation: shimmer 2s linear infinite;
        }

        .app-image {
            height: 400px;
            background: linear-gradient(135deg, rgba(37, 99, 235, 0.05), rgba(59, 130, 246, 0.05));
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .app-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .app-info {
            padding: 40px;
            position: relative;
            z-index: 1;
        }

        .app-info h3 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 20px;
            color: var(--text-primary);
            letter-spacing: -0.01em;
        }

        .app-description {
            color: var(--text-secondary);
            line-height: 1.8;
            margin-bottom: 28px;
            font-size: 1.05rem;
        }

        .app-tags {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 28px;
        }

        .app-tag {
            padding: 8px 18px;
            background: rgba(37, 99, 235, 0.1);
            border: 1px solid rgba(37, 99, 235, 0.2);
            border-radius: 20px;
            font-size: 0.85rem;
            color: var(--accent-primary);
            font-weight: 500;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .app-tag:hover {
            background: rgba(37, 99, 235, 0.15);
            border-color: rgba(37, 99, 235, 0.4);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px var(--glow-primary);
        }

        .app-links {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }

        .app-link {
            padding: 14px 32px;
            background: linear-gradient(135deg, var(--accent-primary) 0%, var(--accent-secondary) 50%, var(--accent-tertiary) 100%);
            background-size: 200% 200%;
            color: white;
            text-decoration: none;
            border-radius: 14px;
            font-weight: 600;
            font-size: 0.95rem;
            letter-spacing: 0.3px;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 20px var(--glow-primary);
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .app-link::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s;
        }

        .app-link:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 8px 30px var(--glow-secondary);
            background-position: 100% 0;
            border-color: rgba(255, 255, 255, 0.3);
        }

        .app-link:hover::before {
            left: 100%;
        }

        .app-link:active {
            transform: translateY(-1px) scale(0.98);
        }

        .arts-grid, .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 32px;
        }

        .art-card, .game-card {
            background: linear-gradient(135deg, #ffffff 0%, #f8fafc 100%);
            border-radius: 24px;
            overflow: hidden;
            border: 1px solid var(--border);
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            box-shadow: var(--shadow-sm);
            position: relative;
            backdrop-filter: blur(30px);
        }

        .art-card:hover, .game-card:hover {
            transform: translateY(-10px);
            box-shadow: var(--shadow-lg), 0 0 50px var(--glow-primary);
            border-color: rgba(37, 99, 235, 0.3);
        }

        .art-image, .game-preview {
            height: 280px;
            background: linear-gradient(135deg, rgba(37, 99, 235, 0.05), rgba(59, 130, 246, 0.05));
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .art-image img, .game-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .art-card:hover .art-image img,
        .game-card:hover .game-preview img {
            transform: scale(1.08);
        }

        .game-embed {
            padding: 0;
            height: 400px;
        }

        .game-iframe {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 0;
        }

        .desktop-game .game-embed {
            height: 500px;
        }

        .mobile-game .game-embed {
            height: 600px;
        }

        @media (max-width: 768px) {
            .desktop-game .game-embed {
                height: 400px;
            }
            .mobile-game .game-embed {
                height: 500px;
            }
        }

        .game-platform {
            font-size: 0.9rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .art-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.95), rgba(248, 250, 252, 0.95));
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s;
            color: var(--text-primary);
            font-weight: 600;
        }

        .art-card:hover .art-overlay {
            opacity: 1;
        }

        .art-info, .game-info {
            padding: 28px;
            position: relative;
            z-index: 1;
        }

        .art-title, .game-title {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 12px;
            color: var(--text-primary);
            letter-spacing: -0.01em;
        }

        .art-description, .game-description {
            color: var(--text-secondary);
            font-size: 0.95rem;
            line-height: 1.7;
            margin-bottom: 16px;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .art-date, .game-date {
            font-size: 0.85rem;
            color: var(--accent-primary);
            font-weight: 500;
        }

        .game-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
        }

        .game-link {
            color: var(--accent-primary);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            background: rgba(37, 99, 235, 0.08);
            border: 1px solid rgba(37, 99, 235, 0.2);
            border-radius: 10px;
            backdrop-filter: blur(10px);
        }

        .game-link:hover {
            color: #ffffff;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            transform: translateX(4px);
            box-shadow: 0 4px 15px var(--glow-primary);
            border-color: rgba(37, 99, 235, 0.4);
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: linear-gradient(135deg, #ffffff 0%, #f8fafc 100%);
            border-radius: 24px;
            max-width: 900px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-lg), 0 0 50px var(--glow-primary);
            animation: slideUp 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(20px);
        }

        @keyframes slideUp {
            from {
                transform: translateY(40px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-close {
            position: absolute;
            top: 24px;
            right: 24px;
            background: rgba(37, 99, 235, 0.1);
            border: 1px solid var(--border);
            color: var(--text-primary);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.5rem;
            transition: all 0.3s;
            backdrop-filter: blur(10px);
        }

        .modal-close:hover {
            background: rgba(37, 99, 235, 0.2);
            border-color: var(--accent-primary);
            transform: rotate(90deg);
            box-shadow: 0 0 20px var(--glow-primary);
        }

        .modal-body {
            padding: 48px;
        }

        .modal-body img {
            width: 100%;
            border-radius: 16px;
            margin-bottom: 32px;
            box-shadow: var(--shadow-md);
        }

        .loading-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }

        .loading-overlay.active {
            display: flex;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(37, 99, 235, 0.2);
            border-top-color: var(--accent-primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .fade-in {
            animation: fadeInUp 0.6s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .app-placeholder, .art-placeholder, .game-placeholder {
            text-align: center;
            padding: 80px 40px;
            background: linear-gradient(135deg, rgba(37, 99, 235, 0.03), rgba(59, 130, 246, 0.03));
            border-radius: 20px;
            border: 2px dashed var(--border);
            backdrop-filter: blur(10px);
        }

        .app-icon, .placeholder-icon {
            font-size: 5rem;
            margin-bottom: 24px;
            opacity: 0.3;
            display: inline-block;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .app-placeholder p, .art-placeholder p, .game-placeholder p {
            color: var(--text-secondary);
            font-size: 1.05rem;
            max-width: 500px;
            margin: 0 auto;
            line-height: 1.7;
        }

        footer {
            text-align: center;
            padding: 60px 0;
            border-top: 1px solid var(--border);
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin-top: 80px;
        }

        footer a {
            color: var(--accent-dark);
            text-decoration: none;
            transition: color 0.3s;
        }

        footer a:hover {
            color: var(--accent);
        }

        #slideshowSection {
            padding: 80px 0;
            overflow: hidden;
        }

        .slideshow-container {
            width: 100%;
            overflow: hidden;
            position: relative;
            margin-top: 40px;
            border-radius: 24px;
            background: linear-gradient(135deg, rgba(37, 99, 235, 0.02), rgba(59, 130, 246, 0.02));
            padding: 20px 0;
        }

        .slideshow-track {
            display: flex;
            gap: 40px;
            animation: slide 25s linear infinite;
            will-change: transform;
        }

        .slideshow-track:hover {
            animation-play-state: paused;
        }

        .slideshow-item {
            flex-shrink: 0;
            width: 450px;
            height: 500px;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .slideshow-item:hover {
            transform: scale(1.05);
            box-shadow: var(--shadow-lg);
        }

        .slideshow-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center bottom;
            display: block;
        }

        @keyframes slide {
            0% {
                transform: translateX(0);
            }
            100% {
                transform: translateX(-50%);
            }
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2.5rem;
            }

            h2 {
                font-size: 2rem;
            }

            .profile-header {
                flex-direction: column;
                text-align: center;
                padding: 32px 24px;
            }

            .profile-image-container,
            .profile-image {
                width: 120px;
                height: 120px;
            }

            .social-links {
                justify-content: center;
            }

            .arts-grid, .games-grid {
                grid-template-columns: 1fr;
                gap: 24px;
            }

            .slideshow-item {
                width: 300px;
                height: 380px;
            }

            #slideshowSection {
                padding: 60px 0;
            }

            .app-info, .modal-body {
                padding: 28px;
            }

            section {
                padding: 60px 0;
            }
        }
    </style>
</head>
<body>
    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
    </div>

    <div class="container">
        <div class="profile-header">
            <div class="profile-image-container">
                <img id="profileImage" class="profile-image" src="" alt="Profile">
            </div>
            <div class="profile-info">
                <h2 class="profile-name" id="profileName">Your Name</h2>
                <p class="profile-bio" id="profileBio">A creative developer building on the Irys network</p>
                <div class="social-links">
                    <a href="#" class="social-link" id="xLink" target="_blank">
                        <span>𝕏</span>
                        <span id="xUsername">@username</span>
                    </a>
                    <a href="#" class="social-link" id="discordLink" target="_blank">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">

        <section id="artsSection">
            <h2>Arts & Designs</h2>
            <div class="arts-grid" id="artsGrid"></div>
        </section>

        <section id="gamesSection">
            <h2>Games</h2>
            <div class="games-grid" id="gamesGrid"></div>
        </section>

        <section id="appSection">
            <h2>Featured App</h2>
            <div id="appShowcase"></div>
        </section>

        <section id="slideshowSection">
            <h2>Latest from X</h2>
            <div class="slideshow-container">
                <div class="slideshow-track" id="slideshowTrack">
                    <!-- Images will be added here dynamically -->
                </div>

    <div class="modal" id="modal">
        <div class="modal-content">
            <button class="modal-close" id="modalClose">×</button>
            <div class="modal-body" id="modalBody"></div>
        </div>
    </div>

    <script src="profile-config.js"></script>
    <script>
        // Beautiful Irys Portfolio Display
        class IrysPortfolio {
            constructor() {
                this.walletAddress = '';
                this.contributions = [];
                this.categorized = null;
                this.localArts = [];
                this.localGames = [];
                this.xPostImages = [];
                this.init();
            }

            init() {
                try {
                    const modalClose = document.getElementById('modalClose');
                    if (modalClose) {
                        modalClose.addEventListener('click', () => {
                            this.closeModal();
                        });
                    }

                    const modal = document.getElementById('modal');
                    if (modal) {
                        modal.addEventListener('click', (e) => {
                            if (e.target.id === 'modal') {
                                this.closeModal();
                            }
                        });
                    }

                    this.autoLoadPortfolio();
                } catch (error) {
                    console.error('Error initializing portfolio:', error);
                }
            }

            async autoLoadPortfolio() {
                // Always load local artworks from public folder first
                await this.loadLocalArts();
                // Load local games
                this.loadLocalGames();
                // Load X post images for slideshow
                this.loadXPostImages();
                
                if (typeof PROFILE_CONFIG !== 'undefined' && PROFILE_CONFIG.walletAddress) {
                    this.walletAddress = PROFILE_CONFIG.walletAddress;
                    this.loadPortfolio();
                } else {
                    this.loadDemoProfile();
                    // Only show demo data if no local arts were found
                    if (this.localArts.length === 0) {
                        this.showDemoData();
                    } else {
                        // Show demo app and games, but keep local arts
                        const demoApp = {
                            id: 'demo-app-1',
                            title: 'owly',
                            description: 'redefining the job marketplace',
                            imageUrl: 'public/arts/irysleader.png',
                            date: new Date(),
                            transactionId: 'demo-app-1'
                        };
                        this.displayApp(demoApp);
                        // Merge local games with demo games
                        const allGames = [...this.localGames];
                        this.displayGames(allGames);
                    }
                }
            }

            async loadXPostImages() {
                this.xPostImages = [];
                
                try {
                    // List of known images in the posts folder
                    // You can add more images here as you add them to public/arts/posts/
                    const imageFiles = [
                        'IMG_8064.PNG', 'IMG_8065.PNG', 'IMG_8066.PNG', 'IMG_8067.PNG', 'IMG_8068.PNG',
                        'IMG_8069.PNG', 'IMG_8070.PNG', 'IMG_8071.PNG', 'IMG_8072.PNG', 'IMG_8073.PNG',
                        'IMG_8074.PNG', 'IMG_8075.PNG', 'IMG_8076.PNG', 'IMG_8077.PNG', 'IMG_8078.PNG',
                        'IMG_8079.PNG', 'IMG_8080.PNG', 'IMG_8081.PNG', 'IMG_8082.PNG', 'IMG_8083.PNG',
                        'IMG_8084.PNG', 'IMG_8085.PNG', 'IMG_8086.PNG', 'IMG_8087.PNG', 'IMG_8088.PNG',
                        'IMG_8089.PNG'
                    ];

                    // Try to verify and load images
                    const validImages = [];
                    for (const filename of imageFiles) {
                        const imagePath = `public/arts/posts/${filename}`;
                        // Try to verify the image exists by attempting to load it
                        try {
                            const response = await fetch(imagePath, { method: 'HEAD' });
                            if (response.ok) {
                                validImages.push(imagePath);
                            }
                        } catch (e) {
                            // Image might still exist, add it anyway
                            validImages.push(imagePath);
                        }
                    }

                    // If no images verified, use all listed images
                    this.xPostImages = validImages.length > 0 ? validImages : imageFiles.map(f => `public/arts/posts/${f}`);
                    
                    console.log(`✅ Loaded ${this.xPostImages.length} X post images from public/arts/posts/`);
                    
                    // Display the slideshow
                    if (this.xPostImages.length > 0) {
                        this.displaySlideshow();
                    }
                } catch (error) {
                    console.warn('Could not load X post images:', error);
                }
            }

            displaySlideshow() {
                const track = document.getElementById('slideshowTrack');
                if (!track || this.xPostImages.length === 0) return;

                // Create slideshow items (duplicate for seamless loop)
                const items = [...this.xPostImages, ...this.xPostImages].map((imageUrl, index) => {
                    return `
                        <div class="slideshow-item">
                            <img src="${imageUrl}" alt="X Post ${index + 1}" loading="lazy">
                        </div>
                    `;
                }).join('');

                track.innerHTML = items;
            }

            async loadLocalArts() {
                this.localArts = [];
                
                try {
                    // Try multiple possible paths for artworks.json
                    const possiblePaths = [
                        'public/arts/artworks.json',
                        './public/arts/artworks.json',
                        '/public/arts/artworks.json'
                    ];
                    
                    let artworks = [];
                    for (const path of possiblePaths) {
                        try {
                            const jsonResponse = await fetch(path + '?t=' + Date.now());
                            if (jsonResponse.ok) {
                                artworks = await jsonResponse.json();
                                console.log(`✅ Loaded artworks from ${path}:`, artworks.length);
                                break;
                            }
                        } catch (e) {
                            // Try next path
                            continue;
                        }
                    }
                    
                    if (Array.isArray(artworks) && artworks.length > 0) {
                        this.localArts = artworks.map(art => ({
                            id: art.id,
                            title: art.title,
                            description: art.description || `A beautiful piece of artwork.`,
                            imageUrl: `public/arts/${art.image}`,
                            date: new Date(art.date || Date.now()),
                            transactionId: art.id,
                            isLocal: true
                        }));
                        console.log(`✅ Processed ${this.localArts.length} artworks`);
                    }
                } catch (error) {
                    console.warn('Could not load artworks.json:', error);
                }

                // Auto-discover images in the folder (as fallback)
                if (this.localArts.length === 0) {
                    console.log('No artworks in JSON, trying auto-discovery...');
                    await this.autoDiscoverImages();
                }
                
                // Display local arts
                if (this.localArts.length > 0) {
                    console.log(`🎨 Displaying ${this.localArts.length} artworks in Arts & Designs section`);
                    this.displayLocalArts();
                } else {
                    console.warn('⚠️ No artworks found to display');
                }
            }

            async autoDiscoverImages() {
                const discoveredImages = [];
                const checkedImages = new Set(this.localArts.map(a => a.imageUrl));
                const imageExtensions = ['.jpg', '.jpeg', '.png', '.gif', '.webp', '.svg'];
                
                // Try to get image list from server (if available)
                try {
                    const apiResponse = await fetch('/api/images.json');
                    if (apiResponse.ok) {
                        const apiImages = await apiResponse.json();
                        apiImages.forEach(img => {
                            const imagePath = img.path || `public/arts/${img.filename}`;
                            if (!checkedImages.has(imagePath) && !this.localArts.some(a => a.imageUrl === imagePath)) {
                                const filename = img.filename || imagePath.split('/').pop();
                                const title = img.name || filename.replace(/[._-]/g, ' ').replace(/\.[^/.]+$/, '').replace(/\b\w/g, l => l.toUpperCase());
                                
                                discoveredImages.push({
                                    id: `auto-${filename.replace(/[^a-z0-9]/gi, '-').toLowerCase()}`,
                                    title: title,
                                    description: `An artwork from your public/arts folder.`,
                                    imageUrl: imagePath,
                                    date: new Date(),
                                    transactionId: `auto-${filename}`,
                                    isLocal: true
                                });
                            }
                        });
                    }
                } catch (e) {
                    // API not available, try direct discovery
                    console.log('Auto-discovering images by checking common patterns...');
                    
                    // Try common naming patterns
                    const patterns = [];
                    for (let i = 1; i <= 50; i++) {
                        patterns.push(`art${i}.jpg`, `art${i}.png`, `artwork${i}.jpg`, `artwork${i}.png`);
                        patterns.push(`design${i}.jpg`, `design${i}.png`, `image${i}.jpg`, `image${i}.png`);
                    }
                    
                    // Check each pattern
                    const checkPromises = patterns.slice(0, 100).map(async (name) => {
                        const imagePath = `public/arts/${name}`;
                        if (checkedImages.has(imagePath)) return null;
                        
                        try {
                            const response = await fetch(imagePath, { method: 'HEAD' });
                            if (response.ok) {
                                const filename = name;
                                const title = name.replace(/[._-]/g, ' ').replace(/\.[^/.]+$/, '').replace(/\b\w/g, l => l.toUpperCase());
                                
                                return {
                                    id: `auto-${filename.replace(/[^a-z0-9]/gi, '-').toLowerCase()}`,
                                    title: title,
                                    description: `An artwork discovered in your public/arts folder.`,
                                    imageUrl: imagePath,
                                    date: new Date(),
                                    transactionId: `auto-${filename}`,
                                    isLocal: true
                                };
                            }
                        } catch (e) {
                            // Image doesn't exist
                        }
                        return null;
                    });
                    
                    const results = await Promise.all(checkPromises);
                    results.forEach(result => {
                        if (result) discoveredImages.push(result);
                    });
                }

                // Add discovered images
                this.localArts = [...this.localArts, ...discoveredImages];
                
                if (discoveredImages.length > 0) {
                    console.log(`✅ Discovered ${discoveredImages.length} new artworks`);
                }
            }

            displayLocalArts() {
                // Always use displayArts to show local arts (it will replace placeholder/demo data)
                if (this.localArts.length > 0) {
                    console.log('Calling displayArts with', this.localArts.length, 'artworks');
                    this.displayArts(this.localArts);
                } else {
                    console.warn('displayLocalArts called but localArts is empty');
                }
            }

            async loadPortfolio() {
                if (!this.walletAddress) {
                    this.loadDemoProfile();
                    this.showDemoData();
                    // Still load local arts
                    await this.loadLocalArts();
                    return;
                }

                const loadingOverlay = document.getElementById('loadingOverlay');
                loadingOverlay.classList.add('active');

                try {
                    // Ensure local arts are loaded first
                    if (this.localArts.length === 0) {
                        await this.loadLocalArts();
                    }
                    
                    this.contributions = await this.fetchContributionsByWallet(this.walletAddress);
                    await this.loadProfile();
                    const categorized = this.categorizeContributions(this.contributions);
                    this.categorized = categorized;
                    this.displayApp(categorized.app);
                    
                    // Merge Irys arts with local arts
                    const allArts = [...(categorized.arts || []), ...(this.localArts || [])];
                    this.displayArts(allArts);
                    
                    // Merge Irys games with local games
                    const allGames = [...(categorized.games || []), ...(this.localGames || [])];
                    this.displayGames(allGames);
                } catch (error) {
                    console.error('Error loading portfolio:', error);
                    this.loadDemoProfile();
                    // Still try to show local arts even if Irys fetch fails
                    if (this.localArts.length === 0) {
                        await this.loadLocalArts();
                    } else {
                        this.displayArts(this.localArts);
                    }
                } finally {
                    loadingOverlay.classList.remove('active');
                }
            }

            async loadProfile() {
                const profileTx = this.contributions.find(tx => {
                    const tags = tx.tags || [];
                    return tags.some(t => t.name?.toLowerCase() === 'profile' || (t.name?.toLowerCase() === 'type' && t.value?.toLowerCase() === 'profile'));
                });

                if (profileTx) {
                    const profileData = await this.fetchProfileData(profileTx.id);
                    this.displayProfile(profileData);
                } else {
                    const profileInfo = this.extractProfileFromTags(this.contributions);
                    if (profileInfo) {
                        this.displayProfile(profileInfo);
                    } else {
                        this.loadDemoProfile();
                    }
                }
            }

            async fetchProfileData(txId) {
                try {
                    const response = await fetch(`https://arweave.net/${txId}`);
                    if (response.ok) {
                        return await response.json();
                    }
                } catch (error) {
                    console.warn('Could not fetch profile data:', error);
                }
                return null;
            }

            extractProfileFromTags(contributions) {
                for (const contrib of contributions) {
                    const tags = contrib.tags || [];
                    const profileInfo = {};
                    
                    tags.forEach(tag => {
                        const name = tag.name?.toLowerCase();
                        const value = tag.value;
                        
                        if (name === 'name' || name === 'profile-name') profileInfo.name = value;
                        if (name === 'bio' || name === 'description' || name === 'write-up') profileInfo.bio = value;
                        if (name === 'profile-image' || name === 'avatar') profileInfo.imageUrl = value;
                        if (name === 'x' || name === 'twitter' || name === 'x-username') profileInfo.xUsername = value;
                        if (name === 'discord' || name === 'discord-username') profileInfo.discordUsername = value;
                        if (name === 'github' || name === 'github-username') profileInfo.githubUsername = value;
                    });
                    
                    if (Object.keys(profileInfo).length > 0) {
                        return profileInfo;
                    }
                }
                return null;
            }

            displayProfile(profile) {
                if (!profile) return;

                if (profile.imageUrl) {
                    const profileImg = document.getElementById('profileImage');
                    if (profileImg) {
                        // Store the image URL for error handling
                        const imageUrl = profile.imageUrl;
                        
                        // Remove any existing onerror handler
                        profileImg.onerror = null;
                        profileImg.style.display = '';
                        
                        // Set the image source
                        console.log('Loading profile image from:', imageUrl);
                        profileImg.src = imageUrl;
                        
                        // Add error handler with proper scope
                        profileImg.onerror = function() {
                            console.error('Profile image failed to load:', imageUrl);
                            console.log('Trying alternative paths...');
                            // Try alternative paths
                            const altPaths = [
                                './' + imageUrl,
                                '/' + imageUrl,
                                imageUrl.replace('public/', '')
                            ];
                            
                            let tried = 0;
                            const img = this;
                            const tryNext = () => {
                                if (tried < altPaths.length) {
                                    console.log('Trying path:', altPaths[tried]);
                                    img.src = altPaths[tried];
                                    tried++;
                                } else {
                                    console.warn('All image paths failed, showing placeholder');
                                    img.style.display = 'none';
                                    if (img.parentElement) {
                                        const placeholder = document.createElement('div');
                                        placeholder.className = 'profile-image';
                                        placeholder.textContent = '👤';
                                        placeholder.style.display = 'flex';
                                        placeholder.style.alignItems = 'center';
                                        placeholder.style.justifyContent = 'center';
                                        img.parentElement.appendChild(placeholder);
                                    }
                                }
                            };
                            
                            img.onerror = tryNext;
                            tryNext();
                        };
                        
                        // Add success handler
                        profileImg.onload = function() {
                            console.log('✅ Profile image loaded successfully from:', this.src);
                            this.style.display = '';
                        };
                    }
                }

                if (profile.name) {
                    const nameEl = document.getElementById('profileName');
                    if (nameEl) nameEl.textContent = profile.name;
                }

                if (profile.xUsername) {
                    const xLink = document.getElementById('xLink');
                    const xUsername = document.getElementById('xUsername');
                    if (xLink && xUsername) {
                        xLink.href = `https://x.com/${profile.xUsername.replace('@', '')}`;
                        xUsername.textContent = profile.xUsername.startsWith('@') ? profile.xUsername : `@${profile.xUsername}`;
                        xLink.style.display = 'flex';
                    }
                }

                if (profile.discordUsername) {
                    const discordLink = document.getElementById('discordLink');
                    const discordUsername = document.getElementById('discordUsername');
                    if (discordLink && discordUsername) {
                        discordLink.href = `https://discord.com/users/${profile.discordUsername}`;
                        discordUsername.textContent = profile.discordUsername.startsWith('@') ? profile.discordUsername : `@${profile.discordUsername}`;
                        discordLink.style.display = 'flex';
                    }
                }

                if (profile.githubUsername) {
                    const githubLink = document.getElementById('githubLink');
                    const githubUsername = document.getElementById('githubUsername');
                    if (githubLink && githubUsername) {
                        githubLink.href = `https://github.com/${profile.githubUsername.replace('@', '')}`;
                        githubUsername.textContent = profile.githubUsername.startsWith('@') ? profile.githubUsername : `@${profile.githubUsername}`;
                        githubLink.style.display = 'flex';
                    }
                }

                if (profile.bio) {
                    const bioEl = document.getElementById('profileBio');
                    if (bioEl) bioEl.textContent = profile.bio;
                }
            }

            loadDemoProfile() {
                if (typeof PROFILE_CONFIG !== 'undefined') {
                    const profile = {
                        name: PROFILE_CONFIG.name || 'Your Name',
                        bio: PROFILE_CONFIG.bio || 'A creative developer building on the Irys network',
                        imageUrl: PROFILE_CONFIG.imageUrl || null,
                        xUsername: PROFILE_CONFIG.xUsername || null,
                        discordUsername: PROFILE_CONFIG.discordUsername || null,
                        githubUsername: PROFILE_CONFIG.githubUsername || null
                    };
                    this.displayProfile(profile);
                    return;
                }

                const profile = {
                    name: 'Your Name',
                    bio: 'Edit the PROFILE_CONFIG in profile-config.js to customize your portfolio',
                    imageUrl: null
                };
                this.displayProfile(profile);
            }

            categorizeContributions(contributions) {
                const categorized = {
                    app: null,
                    arts: [],
                    games: []
                };

                contributions.forEach(contrib => {
                    const tags = contrib.tags || [];
                    const contentType = this.getContentType(tags, contrib);
                    const imageUrl = this.getImageUrl(contrib);
                    const description = this.getDescription(tags);

                    const item = {
                        id: contrib.id,
                        title: this.getTitle(tags) || 'Untitled',
                        description: description,
                        imageUrl: imageUrl,
                        date: new Date(contrib.timestamp || Date.now()),
                        tags: tags,
                        transactionId: contrib.id
                    };

                    if (contentType === 'app' && !categorized.app) {
                        categorized.app = item;
                    } else if (contentType === 'art' || contentType === 'design') {
                        categorized.arts.push(item);
                    } else if (contentType === 'game') {
                        categorized.games.push(item);
                    } else {
                        categorized.arts.push(item);
                    }
                });

                return categorized;
            }

            getContentType(tags, contrib) {
                const typeTag = tags.find(t => 
                    t.name?.toLowerCase() === 'content-type' || 
                    t.name?.toLowerCase() === 'type' ||
                    t.name?.toLowerCase() === 'category'
                );
                
                if (typeTag) {
                    const value = typeTag.value?.toLowerCase();
                    if (value.includes('app') || value.includes('application')) return 'app';
                    if (value.includes('game')) return 'game';
                    if (value.includes('art') || value.includes('design')) return 'art';
                }

                const appTag = tags.find(t => t.name?.toLowerCase().includes('app'));
                const gameTag = tags.find(t => t.name?.toLowerCase().includes('game'));
                const artTag = tags.find(t => t.name?.toLowerCase().includes('art') || t.name?.toLowerCase().includes('design'));

                if (appTag) return 'app';
                if (gameTag) return 'game';
                if (artTag) return 'art';

                const size = contrib.data?.size || 0;
                if (size > 10 * 1024 * 1024) return 'app';
                if (size > 1 * 1024 * 1024) return 'game';
                
                return 'art';
            }

            getImageUrl(contrib) {
                if (contrib.id) {
                    return `https://arweave.net/${contrib.id}`;
                }
                return null;
            }

            getTitle(tags) {
                const titleTag = tags.find(t => 
                    t.name?.toLowerCase() === 'title' || 
                    t.name?.toLowerCase() === 'name'
                );
                return titleTag?.value || null;
            }

            getDescription(tags) {
                const descTag = tags.find(t => 
                    t.name?.toLowerCase() === 'description' || 
                    t.name?.toLowerCase() === 'desc' ||
                    t.name?.toLowerCase() === 'write-up'
                );
                return descTag?.value || 'A creative work stored on the Irys network.';
            }

            displayApp(app) {
                const showcase = document.getElementById('appShowcase');
                
                if (!app) {
                    showcase.innerHTML = `
                        <div class="app-placeholder">
                            <div class="app-icon">🚀</div>
                            <p>No app project found. Upload your app with tags: type=app</p>
                        </div>
                    `;
                    return;
                }

                showcase.innerHTML = `
                    <div class="app-card fade-in">
                        <div class="app-image">

            displayArts(arts) {

                grid.innerHTML = games.map(game => {

                    // Check if it's an embedded game

                        return `

                    // Regular game card
                    return `

                            <div class="game-preview">
                                ${game.imageUrl ? 
                                    `<img src="${game.imageUrl}" alt="${game.title}" onerror="this.parentElement.style.background='linear-gradient(135deg, rgba(37, 99, 235, 0.05), rgba(59, 130, 246, 0.05))'; this.style.display='none';">` :
                                    '<div style="display:flex;align-items:center;justify-content:center;height:100%;font-size:3rem;opacity:0.3">🎮</div>'
                                }
                            </div>
                            <div class="game-info">
                                <h3 class="game-title">${game.title}</h3>
                                <p class="game-description">${game.description}</p>
                                <div class="game-meta">
                                    <span class="game-date">${formattedDate}</span>

            }

            openArtModal(artId) {
                // Try to find in categorized arts first
                let art = this.categorized?.arts?.find(a => a.id === artId);
                
                // If not found, try local arts
                if (!art) {
                    art = this.localArts?.find(a => a.id === artId);
                }
                
                if (!art) return;

                const modal = document.getElementById('modal');
                const modalBody = document.getElementById('modalBody');
                
                const linksHtml = art.isLocal ? '' : `
                    <div style="display:flex;gap:12px;flex-wrap:wrap;">
                        <a href="https://viewblock.io/arweave/tx/${art.transactionId}" target="_blank" class="app-link">View Details</a>
                    </div>
                `;
                
                modalBody.innerHTML = `
                    <h2 style="margin-bottom:20px;font-size:2rem;color:var(--text-primary);">${art.title}</h2>
                    ${art.imageUrl ? `<img src="${art.imageUrl}" alt="${art.title}">` : ''}
                    <p style="color:var(--text-secondary);line-height:1.8;margin-bottom:20px;">${art.description}</p>
                    ${linksHtml}
                `;
                
                modal.classList.add('active');
            }

            closeModal() {
                document.getElementById('modal').classList.remove('active');
            }

            async fetchContributionsByWallet(walletAddress) {
                const query = `
                    query GetTransactions($owners: [String!]) {
                        transactions(owners: $owners, first: 100, sort: HEIGHT_DESC) {
                            edges {
                                node {
                                    id
                                    owner {
                                        address
                                    }
                                    tags {
                                        name
                                        value
                                    }
                                    block {
                                        timestamp
                                    }
                                    data {
                                        size
                                    }
                                }
                            }
                        }
                    }
                `;

                const endpoints = [
                    'https://arweave.net/graphql',
                    'https://arweave-search.goldsky.com/graphql'
                ];

                for (const endpoint of endpoints) {
                    try {
                        const response = await fetch(endpoint, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                query,
                                variables: { owners: [walletAddress] }
                            })
                        });

                        if (!response.ok) continue;

                        const data = await response.json();
                        if (data.errors) continue;

                        const transactions = data.data?.transactions?.edges?.map(edge => {
                            const node = edge.node;
                            return {
                                id: node.id,
                                address: node.owner?.address || walletAddress,
                                timestamp: node.block?.timestamp * 1000 || Date.now(),
                                data: { size: parseInt(node.data?.size || 0) },
                                tags: node.tags || []
                            };
                        }) || [];

                        if (transactions.length > 0) {
                            return transactions;
                        }
                    } catch (err) {
                        console.warn(`Endpoint failed:`, err);
                        continue;
                    }
                }

                return [];
            }
